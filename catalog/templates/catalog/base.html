{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Home{% endblock %} · spacedb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
    <link rel="stylesheet" href="{% static 'catalog/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="nav container">
            <a class="brand" href="{% url 'home' %}">✦ spacedb</a>
            <ul class="nav-links">
                <li><a href="{% url 'galaxy_list' %}" class="{% if 'galaxy' in request.resolver_match.url_name %}active{% endif %}">Galaxies</a></li>
                <li><a href="{% url 'admin:index' %}">Admin</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer container">
        spacedb · a catalog of the universe
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
