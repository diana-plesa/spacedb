{# The object's picture as a tilted photo with a credit: {% include 'catalog/_image.html' with obj=planet %} #}
{% if obj.image_url %}
    <figure class="polaroid">
        <img src="{{ obj.image_url }}" alt="{{ obj.name }}" loading="lazy">
        <figcaption>
            {% if obj.image_source %}
                <a href="{{ obj.image_source }}" target="_blank" rel="noopener">Image: {{ obj.image_credit }}</a>
            {% else %}
                Image: {{ obj.image_credit }}
            {% endif %}
        </figcaption>
    </figure>
{% endif %}
